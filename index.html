<style>
  /* next/font/google declares these three variables on <html> at build time.
     The film's type system reads them (--font-display -> var(--font-archivo),
     --font-sans -> var(--font-geist-sans)), so without them every glyph falls
     back to a default face and the whole design collapses. Declared here with
     real fallbacks so a font-load failure degrades instead of vanishing. */
  :root {
    --font-archivo: 'Archivo';
    --font-geist-sans: 'Geist', system-ui, -apple-system, sans-serif;
    --font-geist-mono: 'Geist Mono', ui-monospace, SFMono-Regular, monospace;
  }
  html, body { margin: 0; padding: 0; height: 100%; background: #050507; }
  #root { height: 100%; }
</style>
