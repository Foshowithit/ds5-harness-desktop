      > "$ARTIFACTS_DIR/encode.log" 2>&1 || true
    tail -25 "$ARTIFACTS_DIR/encode.log"

    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" "'$NODE_BIN' '$LANE_DIR/assert.mjs' encode" \
