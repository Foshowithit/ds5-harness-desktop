    echo "== CAPTURE =="
    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" 'echo MAC_BRIDGE_OK' \
      | awk '$0=="MAC_BRIDGE_OK"{f=1} END{exit(f?0:1)}' \
      || { echo "CAPTURE FAIL: mac bridge unreachable"; exit 1; }

    # rm first: a stale evidence file would let a FAILED stage pass. See the header.
    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" "rm -f '$ROOT/evidence/capture.json'"

    # 505 frames through a pinned virtual clock: ~158.5 s measured, so the node
    # timeout below is ~5x that. This is the only slow stage.
    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" "cd '$ROOT' && '$NODE_BIN' harness/capture.mjs" \
      > "$ARTIFACTS_DIR/capture.log" 2>&1 || true
    tail -25 "$ARTIFACTS_DIR/capture.log"

    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" "'$NODE_BIN' '$LANE_DIR/assert.mjs' capture" \
      | tee "$ARTIFACTS_DIR/capture.txt" || true
    grep -q '^CAPTURE OK' "$ARTIFACTS_DIR/capture.txt" \
      || { echo "CAPTURE FAIL: the evidence assertion did not pass (see capture.txt above)"; exit 1; }
    echo "CAPTURE OK"
  timeout: 900000

- id: encode
