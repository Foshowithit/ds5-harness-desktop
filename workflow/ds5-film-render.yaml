- id: verify
  depends_on: [publish]
  bash: |
    set -euo pipefail
    MAC=$(cat "$ARTIFACTS_DIR/mac.txt")
    ROOT=$(cat "$ARTIFACTS_DIR/root.txt")
    NODE_BIN=$(cat "$ARTIFACTS_DIR/node.txt")
    LANE_DIR=$(cat "$ARTIFACTS_DIR/lane_dir.txt")

    echo "== VERIFY =="
    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" 'echo MAC_BRIDGE_OK' \
      | awk '$0=="MAC_BRIDGE_OK"{f=1} END{exit(f?0:1)}' \
      || { echo "VERIFY FAIL: mac bridge unreachable"; exit 1; }

    # rm first: a stale evidence file would let a FAILED stage pass. See the header.
    # NOTE: the name is `pages`, not `verify` -- that is what verify-pages.mjs writes.
    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" "rm -f '$ROOT/evidence/pages.json'"

    # The published tree is served from a directory whose NAME IS THE REPO NAME, one
    # level above it, so an origin-absolute path fails exactly as it would on
    # https://<user>.github.io/<repo>/. That failure cannot be seen locally with a
    # server rooted at the repo, which is the whole point of this stage.
    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" "cd '$ROOT' && '$NODE_BIN' harness/verify-pages.mjs" \
      > "$ARTIFACTS_DIR/verify.log" 2>&1 || true
    tail -25 "$ARTIFACTS_DIR/verify.log"

    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" "'$NODE_BIN' '$LANE_DIR/assert.mjs' verify" \
      | tee "$ARTIFACTS_DIR/verify.txt" || true
    grep -q '^VERIFY OK' "$ARTIFACTS_DIR/verify.txt" \
      || { echo "VERIFY FAIL: the evidence assertion did not pass (see verify.txt above)"; exit 1; }
    echo "VERIFY OK"
  timeout: 600000

- id: receipt
  depends_on: [verify]
  bash: |
    set -euo pipefail
    MAC=$(cat "$ARTIFACTS_DIR/mac.txt")
    ROOT=$(cat "$ARTIFACTS_DIR/root.txt")

    echo "== RECEIPT =="
    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" 'echo MAC_BRIDGE_OK' \
      | awk '$0=="MAC_BRIDGE_OK"{f=1} END{exit(f?0:1)}' \
      || { echo "RECEIPT FAIL: mac bridge unreachable"; exit 1; }

    # Real bytes, measured on the Mac, ferried back across the bridge. The receipt is
    # therefore a statement about real files, not a restatement of the lane's own
    # claims -- which is the difference between a receipt and a summary.
    ssh -o BatchMode=yes -o ConnectTimeout=15 "$MAC" "
      cd '$ROOT' || exit 1
      echo FILM_X_SHA;     /usr/bin/shasum -a 256 out/ds5-film-x.mp4    | awk '{print \$1}'
      echo FILM_X_BYTES;   /usr/bin/stat -f %z out/ds5-film-x.mp4
      echo FILM_HD_SHA;    /usr/bin/shasum -a 256 out/ds5-film-1080p.mp4 | awk '{print \$1}'
      echo FILM_HD_BYTES;  /usr/bin/stat -f %z out/ds5-film-1080p.mp4
      echo FRAMES;         /usr/bin/find frames -type f -name 'f*.png' | wc -l | tr -d ' '
      echo PAGES_FILES;    /usr/bin/find pages -type f | wc -l | tr -d ' '
      echo PAGES_BYTES;    /usr/bin/find pages -type f -print0 | xargs -0 /usr/bin/stat -f %z | awk '{s+=\$1} END{print s}'
      echo LANE_SHA;       /usr/bin/shasum -a 256 workflow/ds5-film-render.yaml | awk '{print \$1}'
      echo CLOCK_SHA;      /usr/bin/shasum -a 256 harness/clock-init.js | awk '{print \$1}'
    " > "$ARTIFACTS_DIR/receipt-facts.txt" 2>&1 || true
    cat "$ARTIFACTS_DIR/receipt-facts.txt"

    FACT() { awk -v k="$1" '$0==k{getline; print; exit}' "$ARTIFACTS_DIR/receipt-facts.txt"; }

    {
      echo "# DS5 film render -- receipt"
      echo
      echo "VERDICT: PASS"
      echo
      echo "Lane \`ds5-film-render-v1\`, run at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
      echo "Rendered ON THE MAC, through the Dell's \`Host adam-macbook\` bridge."
      echo "Project root: \`$ROOT\`."
      echo
      echo "## The film"
      echo
      echo "| artifact | bytes | sha256 |"
      echo "| --- | ---: | --- |"
      echo "| \`out/ds5-film-1080p.mp4\` | $(FACT FILM_HD_BYTES) | \`$(FACT FILM_HD_SHA)\` |"
      echo "| \`out/ds5-film-x.mp4\` | $(FACT FILM_X_BYTES) | \`$(FACT FILM_X_SHA)\` |"
      echo
      echo "## The published tree"
      echo
      echo "- files: $(FACT PAGES_FILES)"
      echo "- bytes: $(FACT PAGES_BYTES)"
      echo "- frames rendered: $(FACT FRAMES)"
      echo "- lane as shipped: \`workflow/ds5-film-render.yaml\`, sha256 \`$(FACT LANE_SHA)\`"
      echo "- \`harness/clock-init.js\`, sha256 \`$(FACT CLOCK_SHA)\`"
      echo
      echo "## What was asserted, and why each one is not an exit code"
      echo
      echo "| stage | the recorded fact it had to satisfy |"
      echo "| --- | --- |"
      echo "| build | \`boundary.pathsRelativised\`, \`publishedHasLever === false\`, \`captureHasLever === true\`, \`ogCard.controlRejected === 4\` |"
      echo "| bands | \`canonical === true\`, and exactly ONE zero-error FFT normalisation candidate of four |"
      echo "| capture | 505 frames / 505 distinct / \`contentFrames.share >= 0.25\` / \`maxClockError === 0\` / \`hud === 'off'\` / \`analyseCalls 505/505\` |"
      echo "| encode | both cuts \`ok\`, each \`controlRejected === 4\`, H.264/yuv420p, 505 frames, AAC 48 kHz stereo |"
      echo "| publish | \`control 4/4\`, 5 predicates, both \`__cap\` files dropped, \`problems\` empty |"
      echo "| verify | \`staged.matchesTree\`, gate appeared, film started and detached, \`notFoundHard === 0\`, all three assets 200 |"
      echo
      echo "The content floor is the one that matters. This pipeline has already produced"
      echo "a 505-frame run that was an empty grain field with every gate green -- a"
      echo "millisecond/second unit mismatch at the \`clock-init\` boundary -- so frame"
      echo "*count* is not evidence that a film exists. \`contentFrames.share\` is: it"
      echo "measures the fraction of frames carrying any content at all."
    } > "$ARTIFACTS_DIR/RECEIPT.md"

    grep -q '^VERDICT: PASS' "$ARTIFACTS_DIR/RECEIPT.md" \
      || { echo "RECEIPT FAIL: receipt does not say VERDICT: PASS"; exit 1; }
    echo "RECEIPT OK" | tee "$ARTIFACTS_DIR/receipt.txt"
    echo "receipt -> $ARTIFACTS_DIR/RECEIPT.md"
  timeout: 300000
